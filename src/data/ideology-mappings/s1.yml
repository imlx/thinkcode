# 思政映射规则：模块一 Agent Loop（信贷尽调闭环）
# 数据出处：S1表（脱敏代号A/B/C引用）
title: Agent Loop：观察—思考—行动的闭环思维
mapping:
  - 技术概念: 观察（Observe）
    思政概念: 调查研究——“没有调查就没有发言权”
  - 技术概念: 思考（Think）
    思政概念: 政治判断力、政治领悟力、政治执行力
  - 技术概念: 行动（Act）
    思政概念: 务实作风——“空谈误国、实干兴邦”
  - 技术概念: 系统提示词中的价值目标约束
    思政概念: 金融工作的政治性、人民性
scenario:
  银行: 信贷审批“客户尽调—风险研判—授信执行”闭环：客户经理采集企业征信、财务报表与舆情，形成授信结论并自动附加客户适当性评估。
  证券: 投资顾问“市场观察—策略研判—交易执行”闭环：投顾先研读公告与研报（观察），再形成投资建议（思考），最后经适当性校验后下达（行动）。
  保险: 理赔查勘“现场查勘—责任认定—赔付执行”闭环：查勘员先固定证据，再对照条款研判，最后在与客户充分沟通后完成赔付。
aha_prompt: 当你亲手跑通这个循环时，哪个瞬间让你觉得“技术闭环”与“工作闭环”真的是同一件事？
aha_options:
  - 调查研究是谋事之基、成事之道
  - 空谈误国、实干兴邦——闭环成在最后一公里
  - 没有调查就没有发言权——观察环节最耗时也最不能省
  - 人民性藏在细节里——适当性评估自动附加
  - 从群众中来、到群众中去——技术闭环与工作闭环同构
  - 政策执行不能“拍脑袋”——价值目标约束让循环贯通
  - 抓落实就是抓闭环、抓闭环就是抓责任
  - 没有共鸣
