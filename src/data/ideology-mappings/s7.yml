# 思政映射规则：模块七 Feedback Layer 与自修复（测试诊断闭环与错题本）
# 数据出处：S7表（公开消保通报案例F1—F3）
title: Feedback Layer：批评和自我批评的闭环机制
mapping:
  - 技术概念: 断言（assertion）
    思政概念: 批评和自我批评——反馈不是否定，而是系统优化的必要条件
  - 技术概念: 异常捕获与日志回溯
    思政概念: 审计监督——问题显性化、责任可追溯
  - 技术概念: 自修复
    思政概念: 知错即改、立行立改
  - 技术概念: 错题本（lessons.md 记忆固化）
    思政概念: 复盘机制——把每一次偏差转化为下一次正确的前置条件
scenario:
  银行: 合规审计复盘：营销文案断言“必须包含风险提示”（反面用例F1夸大收益、F2风险揭示不足），失败自动记入错题本并在后续运行前置加载。
  证券: 适当性管理校验：投顾建议必须附适当性评估断言，违规案例写入团队复盘库。
  保险: 销售行为质检：话术断言“不得夸大收益”，质检失败自动回流培训题库。
aha_prompt: 看着Agent从失败日志中自动修复问题时，你如何理解“批评和自我批评是优良传统”？
aha_options:
  - 批评和自我批评——反馈不是否定而是系统优化的必要条件
  - 惩前毖后、治病救人——对同志的真正爱护
  - 知错能改，善莫大焉——错题本让偏差成为正确的前置
  - 失败是成功之母——每一次异常都是组织的免疫力
  - 闻过则喜——断言前置比事后抽查更有制度善意
  - 前事不忘、后事之师——日志回溯就是自我批评的技术形态
  - 抓早抓小、防微杜渐——修复发生在萌芽状态
  - 没有共鸣
