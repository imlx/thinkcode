# 思政映射规则：模块三 TodoWrite 与 Planning（五篇大文章战略拆解）
# 数据出处：S3表（国有大行年报、央行公开数据）
title: TodoWrite 与 Planning：系统思维与战略统筹
mapping:
  - 技术概念: 任务拆解（decompose）
    思政概念: 战略拆解——宏大叙事落实为岗位动作
  - 技术概念: 依赖排序（拓扑排序）
    思政概念: 系统观念——把握先后次序，不能“单打一”
  - 技术概念: 进度看板与状态流转
    思政概念: 可追踪、可检验的执行力
  - 技术概念: 优先级（priority）
    思政概念: 主要矛盾——牵住“牛鼻子”
scenario:
  银行: 总行把“五篇大文章”拆解为部门任务清单：科技金融“投早投小”客户清单梳理、绿色金融标准对标、普惠触达率提升，依赖关系清晰、进度可追踪。
  证券: 投行项目拆解：尽调、申报、发行、督导各阶段设置依赖与里程碑，项目看板全组可见。
  保险: 农险服务网络建设：先建乡镇服务点（依赖前置），再推进承保覆盖面提升。
aha_prompt: 把“五篇大文章”写成可执行的 Todo List 之后，你对“战略不是口号”这句话有了什么新理解？
aha_options:
  - 战略不是口号，而是一组有依赖、可追踪的具体行动
  - 系统观念——十个指头弹钢琴，不能单打一
  - 致广大而尽精微——宏大叙事要落到岗位动作
  - 全国一盘棋——局部目标服从全局拓扑
  - 善弈者谋势——先谋后动、谋定后动
  - 一张蓝图绘到底——进度看板让战略可交付
  - 抓主要矛盾也要抓矛盾的主要方面——优先级就是政治
  - 没有共鸣
