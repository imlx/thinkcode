# 思政映射规则：模块五 Subagents（小微企业贷款专项排查）
# 数据出处：S5表（监管公开罚单原型，脱敏代号E1—E5）
title: Subagents：集体主义与组织纪律性
mapping:
  - 技术概念: 任务隔离（独立 messages 列表）
    思政概念: 分工负责——各司其职、各尽其责
  - 技术概念: 协议通信（sender/intent/payload/requires_consensus）
    思政概念: 民主集中制——组织的协议层与共同语言
  - 技术概念: 主 Agent 集中裁决
    思政概念: 集中统一领导——“充分讨论、集中裁决”
  - 技术概念: 并行执行
    思政概念: 协同作战——整体合力大于个体之和
scenario:
  银行: 小微企业贷款专项排查：公司金融部、风险管理部、运营管理部三个子智能体并行排查E1—E5，对E2给出相反结论时由主Agent裁决采纳风控意见。
  证券: 联合尽调：行业组、财务组、法务组并行核查，分歧提交项目组集中讨论裁决。
  保险: 反欺诈联合调查：调查、核保、理赔三个条线分头取证，结论由调查组长汇总裁决。
aha_prompt: 调试两个子Agent冲突裁决逻辑时，你是否理解了跨部门协作为什么需要“共同语言”和集中裁决？
aha_options:
  - 民主集中制——充分讨论、集中裁决
  - 集体主义——局部最优服从全局最优
  - 组织纪律性——协议就是共同语言、纪律就是接口
  - 分工负责、各司其职——任务隔离的制度价值
  - 团结—批评—团结——冲突裁决的正向循环
  - 上下同欲者胜——目标一致才能并行不悖
  - 集中指导下的民主，民主基础上的集中
  - 没有共鸣
