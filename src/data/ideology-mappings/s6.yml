# 思政映射规则：模块六 Skills 与记忆系统（组织知识沉淀）
# 制度出处：S6表（尽职指引附录及监管规则原文提炼）
title: Skills 与记忆系统：学习型党组织建设
mapping:
  - 技术概念: 技能模块（SKILL.md）
    思政概念: 组织知识沉淀——把个人经验转化为组织能力
  - 技术概念: 按需加载（load on demand）
    思政概念: 学习型组织——学以致用、急用先学
  - 技术概念: 目录常驻、全文按需注入
    思政概念: 知识管理——索引在手、用时调取
  - 技术概念: 记忆固化与复用
    思政概念: 红色基因与专业能力的代际传承
scenario:
  银行: 信贷审查要点知识库：骨干客户经理的展业经验、风险识别清单、合规审查要点固化为三个技能模块，新人贷前审查按需加载。
  证券: 研究平台知识库：资深分析师的行业分析框架沉淀为可复用模块，初级研究员按需调用。
  保险: 核保规则库：核保专家的经验固化为技能文件，分支机构核保员按需加载，尺度全系统一致。
aha_prompt: 把骨干员工的审查要点写成可插拔模块时，你是否体会到“传帮带”数字化的意义？
aha_options:
  - 建设学习型组织——把个人经验沉淀为组织能力
  - 传帮带数字化——骨干经验不随人员流动流失
  - 活到老、学到老——按需加载就是“急用先学”
  - 红色基因的代际传承——知识沉淀即基因延续
  - 三人行必有我师——技能库是组织共同的师傅
  - 复盘是最好的学习——写技能模块本身就是复盘
  - 工欲善其事、必先利其器——专业能力即政治能力
  - 没有共鸣
