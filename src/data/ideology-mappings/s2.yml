# 思政映射规则：模块二 Tool Use 与权限管理（岗位授权审批）
# 制度出处：S2表（双签制、征信授权等监管规则）
title: Tool Use 与权限管理：权责对等的制度意识
mapping:
  - 技术概念: 工具注册与调度字典
    思政概念: 岗位授权清单——每一行都是责任承诺书
  - 技术概念: permission 元数据（角色/级别/风险）
    思政概念: 权责对等——“权限即责任”
  - 技术概念: 默认拒绝（Deny by Default）
    思政概念: 底线思维——“法无授权不可为”
  - 技术概念: 双人复核（dual approval）
    思政概念: 用权受监督——双签制的技术实现
scenario:
  银行: 岗位权限配置：客户经理持客户书面授权方可查询征信；授信额度审批必须两名审批官双签，同一操作员不能发起又审批。
  证券: 交易系统权限：投顾有建议权但无自营下单权；大额划转强制双人复核，防范违规代客操作。
  保险: 核保与理赔权限分离：核保员有承保决定权就必须承担尽职核查责任；高额理赔须双人签批。
aha_prompt: 当你亲手为高风险工具加上“默认拒绝”规则时，你对“有权必有责、用权受监督”的理解发生了什么变化？
aha_options:
  - 法无授权不可为——默认拒绝是制度先行的底线思维
  - 有权必有责、用权受监督
  - 把权力关进制度的笼子——授权清单就是责任清单
  - 双人复核不是效率负担，而是保护干部的制度设计
  - 制度的生命在于执行，执行的关键在于刚性
  - 信任不能代替监督，技术让监督无处不在
  - 阳光是最好的防腐剂——审批留痕让权力透明运行
  - 没有共鸣
