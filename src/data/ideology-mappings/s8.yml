# 思政映射规则：模块八 Worktree Isolation 与 Harness 约束（三层隔离护栏）
# 制度出处：S8表（公开处罚与法规，机构名称脱敏）
title: Worktree Isolation：底线思维与廉洁从业
mapping:
  - 技术概念: 环境沙箱
    思政概念: 公与私的隔离
  - 技术概念: 工作树隔离
    思政概念: 权与钱的隔离——高风险操作在制度轨道上运行
  - 技术概念: 协议层白名单
    思政概念: 亲与清的隔离——法无授权不可为
  - 技术概念: “成功静默、失败发声”日志策略
    思政概念: 合规无小事、风险零容忍
scenario:
  银行: 员工行为管理：Agent试图将客户数据导出到个人目录，被三层隔离阻断并即时告警、写入审计日志（原型：某分行被罚款462.35万元，S8表）。
  证券: 信息隔离墙：研究员越权访问未公开研报草稿被沙箱拦截并上报合规。
  保险: 客户信息保护：未经书面授权批量查询个人征信被白名单拦截（原型：某外资银行被罚57万元，S8表）。
aha_prompt: 当“越权导出”被沙箱阻断、审计日志立即发声时，你如何理解“把权力关进制度的笼子”？
aha_options:
  - 把权力关进制度的笼子——约束不是束缚而是保护
  - 底线思维——防线在不用时最有价值
  - 公与私、权与钱、亲与清——三层隔离的政治伦理
  - 慎独——越权尝试立即告警是制度的“千里眼”
  - 成功静默、失败发声——合规文化的工程化表达
  - 勿以恶小而为之——审计日志让小动作无所遁形
  - 廉洁从业——亲手配置护栏才懂底线思维保护干部
  - 没有共鸣
