code_path: s4_bond_compact/bond_compact.py
# 思政映射规则：模块四 Context Compact（债市上下文压缩）
# 数据出处：S4表（真实公开语料种子，逐条标注来源编号）
title: Context Compact：去伪存真、把握主要矛盾
mapping:
  - 技术概念: 权威性分层（政策原文>官媒解读>市场传闻>情绪帖）
    思政概念: 政治判断力——信息源也有“政治性权重”
  - 技术概念: 相关性打分
    思政概念: 去粗取精——围绕主要矛盾筛选信息
  - 技术概念: 去噪摘要
    思政概念: 去伪存真、由此及彼、由表及里
  - 技术概念: token 预算约束下的取舍
    思政概念: 有限认知资源下的战略清醒与政治定力
scenario:
  银行: 债券投资研究：某交易日50条混合信息流（政策原文、官媒解读、市场传闻、情绪帖）在预算内压缩为保留政策要点与关键点位的事实摘要。
  证券: 晨会材料准备：研究员从 overnight 公告与舆情中筛出对组合有实质影响的三五条，剔除情绪渲染。
  保险: 资产负债匹配监测：从海量市场数据中滤除噪音，锁定影响久期匹配的关键利率信号。
aha_prompt: 为信息源设置权威性权重时，你是否意识到调查研究方法论的“十六字诀”就是一套人工的上下文压缩算法？
aha_options:
  - 去粗取精、去伪存真、由此及彼、由表及里
  - 把握主要矛盾——在信息过载中保持战略清醒
  - 实事求是——权威性分层是政治判断力的信息科学版
  - 谣言止于智者，噪声止于权重
  - 战略定力——情绪帖最先被剔除不是冷漠而是清醒
  - 兼听则明、偏信则暗——多源交叉验证
  - 由表及里——预算约束逼着抓本质
  - 没有共鸣
